
name: WRC-X3200GST3 OpenWrt KEXEC Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.seed'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            subversion \
            swig \
            time \
            xsltproc \
            libelf-dev \
            libpython3-dev

      - name: Build OpenWrt
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
        env:
          OPENWRT_REF: v25.12.6
          JOBS: 2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WRC-X3200GST3-OpenWrt-25.12.6-KEXEC
          path: out/
          if-no-files-found: error
          retention-days: 30
